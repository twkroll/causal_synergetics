<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
<title id="title">Figure 1 — Diagnostic schematic</title>
<desc id="desc">Full-state fibre to pre-declared synergetic macro, frozen intervention family and retained response, standard controlled-projectability test, and either sufficient macro or hidden-mode leakage.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#222"/></marker></defs>
<rect x="35" y="145" width="245" height="155" rx="18" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
<text x="157" y="185" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="700">Full-state fibre</text>
<text x="157" y="225" text-anchor="middle" font-family="sans-serif" font-size="22">x = (q, r)</text>
<text x="157" y="260" text-anchor="middle" font-family="sans-serif" font-size="20">same q, hidden r</text>
<line x1="280" y1="222" x2="355" y2="222" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="365" y="125" width="275" height="195" rx="18" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
<text x="503" y="170" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700">Pre-declared</text>
<text x="503" y="205" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700">synergetic macro</text>
<text x="503" y="245" text-anchor="middle" font-family="sans-serif" font-size="22">π(q,r) = q</text>
<text x="503" y="278" text-anchor="middle" font-family="sans-serif" font-size="18">slaving map fixed before test</text>
<line x1="640" y1="222" x2="715" y2="222" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="725" y="105" width="300" height="235" rx="18" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
<text x="875" y="150" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">Frozen intervention</text>
<text x="875" y="182" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">family + response</text>
<text x="875" y="225" text-anchor="middle" font-family="sans-serif" font-size="21">u ∈ 𝒰, horizon T</text>
<text x="875" y="260" text-anchor="middle" font-family="sans-serif" font-size="21">Γ(x,u) = q(·)</text>
<text x="875" y="295" text-anchor="middle" font-family="sans-serif" font-size="18">full retained trajectory</text>
<line x1="1025" y1="222" x2="1100" y2="222" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1110" y="125" width="255" height="195" rx="18" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
<text x="1238" y="170" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">Standard controlled-</text>
<text x="1238" y="202" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700">projectability test</text>
<text x="1238" y="245" text-anchor="middle" font-family="sans-serif" font-size="20">f(q,r,u) = f̄(q,u)?</text>
<text x="1238" y="278" text-anchor="middle" font-family="sans-serif" font-size="17">established quotient criterion</text>
<line x1="1238" y1="320" x2="1238" y2="385" stroke="#222" stroke-width="3"/>
<line x1="1238" y1="385" x2="1050" y2="385" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="1238" y1="385" x2="1325" y2="385" stroke="#222" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="820" y="370" width="225" height="105" rx="15" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
<text x="933" y="410" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700">Sufficient macro</text>
<text x="933" y="445" text-anchor="middle" font-family="sans-serif" font-size="18">fibre-homogeneous response</text>
<rect x="1130" y="370" width="235" height="105" rx="15" fill="#f7f7f7" stroke="#222" stroke-width="2"/>
<text x="1248" y="410" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700">Hidden-mode leakage</text>
<text x="1248" y="445" text-anchor="middle" font-family="sans-serif" font-size="18">diagnostic mismatch</text>
<text x="35" y="60" font-family="sans-serif" font-size="32" font-weight="700">Figure 1. Diagnostic question for a pre-declared synergetic macro</text>
<text x="35" y="95" font-family="sans-serif" font-size="18">Conceptual only; no quantitative data. The projectability criterion is standard and is used diagnostically.</text>
</svg>